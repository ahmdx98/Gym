<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ahmed Gym">
  <meta name="theme-color" content="#111111">
  <title>Ahmed's Gym</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:#F8F7F4;font-family:'Courier New',Courier,monospace;color:#111;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
    input[type=number]{-moz-appearance:textfield;}
    input:focus{outline:none;border-color:#FF5C00!important;}
    button{cursor:pointer;font-family:'Courier New',Courier,monospace;}
    button:active{opacity:.6;}
    .sticky{position:sticky;top:0;z-index:100;}
    .card{background:#fff;border:2px solid #E2E2E2;border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .2s,background .2s;}
    .card.done{background:#F0FDF4;border-color:#16A34A;}
    .card.skip{background:#FEF2F2;border-color:#FCA5A5;}
    .card.extra{border-color:#FF5C00;}
    .wbtn{width:40px;height:40px;border-radius:8px;border:2px solid #E2E2E2;background:#fff;color:#111;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s;}
    .wbtn.on{background:#FF5C00;border-color:#FF5C00;color:#fff;}
    .tab{flex:1;padding:12px 4px;border:none;border-bottom:3px solid transparent;background:none;font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.08em;cursor:pointer;color:#666;}
    .tab.on{border-bottom-color:#FF5C00;color:#FF5C00;}
    .tab.dn{color:#16A34A;}
    .ni{width:100%;padding:10px 4px;border:2px solid #E2E2E2;border-radius:10px;font-size:20px;font-weight:800;text-align:center;color:#111;font-family:inherit;background:#fff;}
    .ni.cal{border-color:#FF5C00;background:#FFF7F0;color:#FF5C00;}
    .abtn{width:100%;padding:10px 12px;border:2px solid #FFD0B0;border-radius:8px;background:#FFF7F0;font-family:inherit;font-size:13px;font-weight:700;color:#7C2D00;text-align:left;margin-bottom:5px;display:block;}
    .abtn.on{background:#FF5C00;border-color:#FF5C00;color:#fff;}
    .sr{width:100%;padding:11px 14px;background:#fff;border:none;border-bottom:1px solid #E2E2E2;text-align:left;font-size:13px;font-weight:600;color:#111;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;}
    .sr.nw{background:#FFF7F0;color:#7C2D00;font-weight:700;}
    .iconbtn{width:36px;height:36px;border-radius:10px;flex-shrink:0;border:2px solid #E2E2E2;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;}
    .iconbtn.cop{background:#16A34A;border-color:#16A34A;color:#fff;}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#111;color:#fff;padding:11px 20px;border-radius:30px;font-size:12px;font-weight:700;letter-spacing:.05em;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;}
    .toast.show{opacity:1;}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>

// ── DATA ─────────────────────────────────────────────────────
const LIB = [
  "Barbell Back Squat","Barbell Front Squat","Safety Bar Squat","Hack Squat",
  "Leg Press","Bulgarian Split Squat","Lunges","Step Ups","Goblet Squat","Leg Extension Machine",
  "Conventional Deadlift","Sumo Deadlift","Romanian Deadlift","Stiff Leg Deadlift",
  "Hip Thrust Machine","Barbell Hip Thrust","Glute Bridge","Leg Curl Machine","Leg Curl Seated",
  "Nordic Curl","Good Morning","Cable Pull Through",
  "Barbell Bench Press","Dumbbell Bench Press","Incline Barbell Press","Incline Dumbbell Press",
  "Incline Machine Press","Decline Press","Machine Chest Press","Cable Fly","Dumbbell Fly","Pec Dec",
  "Barbell OHP","Dumbbell OHP","Arnold Press","Seated Machine OHP","Landmine Press",
  "Cable Lateral Raise","DB Lateral Raise","Rear Delt Fly DB","Rear Delt Fly Machine","Face Pull",
  "Barbell Bent Over Row","Dumbbell Row","Seated Cable Row","Machine Row",
  "Chest Supported Row","Meadows Row","Pendlay Row",
  "Pull Up","Weighted Pull Up","Chin Up","Lat Pulldown","Lat Pulldown Neutral",
  "Single Arm Pulldown","Straight Arm Pulldown",
  "Barbell Curl","Dumbbell Curl","Incline Dumbbell Curl","Cable Curl","Hammer Curl",
  "Preacher Curl Machine","Close Grip Bench Press","Cable Tricep Pushdown",
  "Overhead Cable Tricep Ext","Skull Crushers","Dips","Shoulder Machine",
  "Plank","Cable Crunch","Hanging Leg Raise","Ab Wheel","Pallof Press","Landmine Rotation",
  "Ab Crunch Machine","Reverse Pec Deck Machine",
  "Standing Calf Raise","Seated Calf Raise","Leg Press Calf Raise","Calf Raise",
];
const ALTS = {
  "Machine Chest Press":["Dumbbell Bench Press","Cable Fly","Barbell Bench Press"],
  "Incline Machine Press":["Incline Dumbbell Press","Incline Barbell Press","Cable Fly"],
  "Lat Pulldown":["Lat Pulldown Neutral","Single Arm Pulldown","Pull Up"],
  "Seated Cable Row":["Machine Row","Chest Supported Row","Dumbbell Row"],
  "Seated Machine OHP":["Dumbbell OHP","Barbell OHP","Arnold Press"],
  "Shoulder Machine":["Cable Lateral Raise","DB Lateral Raise","Face Pull"],
  "Cable Tricep Pushdown":["Skull Crushers","Close Grip Bench Press","Dips"],
  "Overhead Cable Tricep Ext":["Skull Crushers","Cable Tricep Pushdown","Dips"],
  "Cable Curl":["Dumbbell Curl","Barbell Curl","Preacher Curl Machine"],
  "Leg Press":["Hack Squat","Goblet Squat","Barbell Back Squat"],
  "Romanian Deadlift":["Stiff Leg Deadlift","Cable Pull Through","Good Morning"],
  "Leg Curl Machine":["Leg Curl Seated","Nordic Curl","Stiff Leg Deadlift"],
  "Cable Lateral Raise":["DB Lateral Raise","Rear Delt Fly Machine","Face Pull"],
  "Calf Raise":["Seated Calf Raise","Leg Press Calf Raise","Standing Calf Raise"],
  "Hip Thrust Machine":["Barbell Hip Thrust","Glute Bridge","Cable Pull Through"],
  "Leg Extension Machine":["Leg Press","Hack Squat","Bulgarian Split Squat"],
  "Ab Crunch Machine":["Cable Crunch","Hanging Leg Raise","Plank"],
  "Reverse Pec Deck Machine":["Rear Delt Fly Machine","Rear Delt Fly DB","Face Pull"],
};
const SESSIONS = {
  "Upper A":[{name:"Machine Chest Press",bw:12.5},{name:"Lat Pulldown",bw:12.5},{name:"Seated Cable Row",bw:15},{name:"Seated Machine OHP",bw:12.5},{name:"Reverse Pec Deck Machine",bw:"CAL"},{name:"Cable Tricep Pushdown",bw:12.5},{name:"Cable Curl",bw:10}],
  "Lower A":[{name:"Leg Press",bw:20},{name:"Romanian Deadlift",bw:12.5},{name:"Leg Curl Machine",bw:12.5},{name:"Cable Lateral Raise",bw:4},{name:"Calf Raise",bw:"BW+5"},{name:"Ab Crunch Machine",bw:"CAL"}],
  "Upper B":[{name:"Incline Machine Press",bw:12.5},{name:"Lat Pulldown",bw:12.5},{name:"Seated Cable Row",bw:15},{name:"Shoulder Machine",bw:12.5},{name:"Reverse Pec Deck Machine",bw:"CAL"},{name:"Overhead Cable Tricep Ext",bw:10},{name:"Cable Curl",bw:10}],
  "Lower B":[{name:"Leg Press",bw:25},{name:"Hip Thrust Machine",bw:"CAL"},{name:"Leg Extension Machine",bw:"CAL"},{name:"Leg Curl Machine",bw:12.5},{name:"Calf Raise",bw:"BW+5"},{name:"Ab Crunch Machine",bw:"CAL"}],
};
const SORDER = ["Upper A","Lower A","Upper B","Lower B"];
const gBlock = w => w<=4?1:w<=8?2:w<=11?3:"deload";
const BDATA = {
  1:{label:"FOUNDATION",sets:3,reps:10,rpe:"7",bg:"#1D4ED8",lt:"#EFF6FF"},
  2:{label:"BUILD",sets:4,reps:8,rpe:"7-8",bg:"#047857",lt:"#ECFDF5"},
  3:{label:"PUSH",sets:4,reps:6,rpe:"8-9",bg:"#B91C1C",lt:"#FEF2F2"},
  deload:{label:"DELOAD",sets:2,reps:12,rpe:"6",bg:"#6D28D9",lt:"#F5F3FF"},
};

// ── STATE ────────────────────────────────────────────────────
let S = {week:1,session:"Upper A",log:{},weights:{},swaps:{},extras:{},openAlt:null,search:"",copied:false};

function sv(){try{
  localStorage.setItem("g4-log",JSON.stringify(S.log));
  localStorage.setItem("g4-wts",JSON.stringify(S.weights));
  localStorage.setItem("g4-swp",JSON.stringify(S.swaps));
  localStorage.setItem("g4-ext",JSON.stringify(S.extras));
  localStorage.setItem("g4-nav",JSON.stringify({week:S.week,session:S.session}));
}catch(e){}}
function ld(){try{
  S.log=JSON.parse(localStorage.getItem("g4-log")||"{}");
  S.weights=JSON.parse(localStorage.getItem("g4-wts")||"{}");
  S.swaps=JSON.parse(localStorage.getItem("g4-swp")||"{}");
  S.extras=JSON.parse(localStorage.getItem("g4-ext")||"{}");
  const n=JSON.parse(localStorage.getItem("g4-nav")||"null");
  if(n){S.week=n.week;S.session=n.session;}
}catch(e){}}
function upd(o){Object.assign(S,o);sv();render();}

// ── KEYS ─────────────────────────────────────────────────────
function lk(i){return "w"+S.week+"-"+S.session.replace(" ","")+"-"+i;}
function wk(s,i){return s+"||"+i;}
function sk(s,i){return s+"||"+i+"||swap";}
function ek(){return "w"+S.week+"-"+S.session.replace(" ","");}

// ── GETTERS ──────────────────────────────────────────────────
function getEx(i){
  const ex=SESSIONS[S.session][i],b=BDATA[gBlock(S.week)];
  const sw=S.swaps[sk(S.session,i)],w=S.weights[wk(S.session,i)];
  const rec=S.log[lk(i)]||{};
  const status=rec.status??(rec.done?"done":null);
  return {name:sw||ex.name,orig:ex.name,swapped:!!sw,alts:ALTS[ex.name]||[],
    sets:rec.sets??b.sets,reps:rec.reps??b.reps,
    weight:w!==undefined?w:ex.bw,status:status,done:status==="done",skip:status==="skip"};
}
function sDone(w,s){return SESSIONS[s].every((_,i)=>{const r=S.log["w"+w+"-"+s.replace(" ","")+"-"+i];return r&&(r.status==="done"||r.status==="skip"||r.done===true);});}
function search(q){if(!q||q.trim().length<2)return[];const lo=q.trim().toLowerCase();return LIB.filter(e=>e.toLowerCase().includes(lo)).slice(0,6);}

function fmtLog(){
  const b=gBlock(S.week),bd=BDATA[b],ex=SESSIONS[S.session],extras=S.extras[ek()]||[];
  const d=new Date().toLocaleDateString("en-GB");
  // only include exercises that are checked (done)
  const doneBase=ex.map((_,i)=>getEx(i)).filter(e=>e.status==="done");
  const doneExtra=extras.filter(e=>e.done);
  if(doneBase.length===0&&doneExtra.length===0){
    return "No exercises checked yet for "+S.session+" (Week "+S.week+").\nTick off what you completed, then tap COPY LOG.";
  }
  let o="["+d+"] — "+S.session+"\nWeek "+S.week+" | Block "+(b==="deload"?"Deload":b)+" ("+bd.label+")\n\n";
  o+="Exercise                       | Sets x Reps | Weight\n"+"─".repeat(57)+"\n";
  doneBase.forEach(e=>{o+=(e.name+" ").padEnd(31)+"| "+(e.sets+" x "+e.reps).padEnd(11)+"| "+e.weight+" kg\n";});
  doneExtra.forEach(e=>{o+=((e.name+" [EXTRA]")+" ").padEnd(31)+"| "+((e.sets||bd.sets)+" x "+(e.reps||bd.reps)).padEnd(11)+"| "+(e.weight||"—")+" kg\n";});
  o+="\nSession notes: [add here before pasting to Claude]\n";return o;
}

// ── ROBUST COPY (works as saved file) ────────────────────────
function copyText(t,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(cb).catch(()=>fbCopy(t,cb));
  }else{fbCopy(t,cb);}
}
function fbCopy(t,cb){
  const ta=document.createElement("textarea");
  ta.value=t;ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");cb&&cb();}catch(e){prompt("Copy this:",t);}
  document.body.removeChild(ta);
}
function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),1600);
}

// ── RENDER ───────────────────────────────────────────────────
function render(){
  const fa=document.activeElement,fid=fa?.id,ss=fa?.selectionStart,se=fa?.selectionEnd;
  document.getElementById("app").innerHTML=html();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(ss,se);}catch(e){}}}
}
function html(){
  const b=gBlock(S.week),bd=BDATA[b],ex=SESSIONS[S.session],extras=S.extras[ek()]||[];
  const tot=ex.length;
  const dn=ex.filter((_,i)=>getEx(i).status).length;
  const pct=tot>0?(dn/tot*100):0,allDone=dn===tot&&tot>0;
  return `
  <div class="sticky" style="background:#111;color:#fff;padding:16px 18px 12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div>
        <div style="font-size:10px;color:#888;letter-spacing:.18em;margin-bottom:2px;">AHMED · 12 WEEK PROGRAMME</div>
        <div style="font-size:20px;font-weight:700;">WEEK ${S.week} <span style="color:#555;font-size:14px;">/ ${S.session}</span></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button onclick="cpLog()" style="background:${S.copied?"#16A34A":"#FF5C00"};color:#fff;border:none;border-radius:6px;padding:7px 11px;font-size:10px;font-weight:700;letter-spacing:.1em;">${S.copied?"COPIED ✓":"COPY LOG"}</button>
        <div style="background:${bd.bg};color:#fff;border-radius:6px;padding:7px 11px;font-size:10px;font-weight:700;letter-spacing:.12em;">${bd.label}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="flex:1;height:5px;background:#2a2a2a;border-radius:3px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:#FF5C00;border-radius:3px;transition:width .4s;"></div></div>
      <div style="font-size:11px;color:#aaa;">${dn}/${tot}</div>
    </div>
  </div>
  <div style="background:#fff;border-bottom:1px solid #E2E2E2;padding:14px 18px;">
    <div style="font-size:10px;color:#666;letter-spacing:.15em;margin-bottom:10px;">SELECT WEEK</div>
    <div style="display:flex;flex-wrap:wrap;gap:7px;">
      ${Array.from({length:12},(_,k)=>k+1).map(w=>{
        const wb=BDATA[gBlock(w)],wa=w===S.week,wd=SORDER.every(s=>sDone(w,s));
        return `<button class="wbtn${wa?" on":""}" onclick="setWk(${w})" style="${wa?"":("border-color:"+(wd?wb.bg:"#E2E2E2")+";background:"+(wd?wb.lt:"#fff")+";color:"+(wd?wb.bg:"#111")+";")}">${w}<div style="width:4px;height:4px;border-radius:50%;background:${wa?"rgba(255,255,255,.7)":wb.bg};opacity:${wa?1:.5};"></div></button>`;
      }).join("")}
    </div>
  </div>
  <div style="background:#fff;border-bottom:2px solid #E2E2E2;display:flex;">
    ${SORDER.map(s=>{const a=s===S.session,d=sDone(S.week,s);return `<button class="tab${a?" on":d?" dn":""}" onclick="setSes('${s}')">${s}${d?" ✓":""}</button>`;}).join("")}
  </div>
  <div style="background:${bd.lt};border-bottom:1px solid #E2E2E2;padding:9px 18px;display:flex;gap:16px;">
    <div style="font-size:11px;font-weight:700;">Block ${b==="deload"?"—":b}</div>
    <div style="font-size:11px;color:#666;">Target: ${bd.sets} × ${bd.reps} reps · RPE ${bd.rpe}</div>
  </div>
  <div style="padding:14px 14px 8px;">
    ${ex.map((_,i)=>cardHtml(i,bd)).join("")}
    ${extras.length>0?`<div style="font-size:10px;color:#666;letter-spacing:.15em;font-weight:700;margin-bottom:10px;margin-top:4px;">EXTRA EXERCISES</div>${extras.map((e,i)=>extraHtml(e,i,bd)).join("")}`:""}
    ${addHtml()}
    ${allDone?`<div style="background:#16A34A;border-radius:14px;padding:18px;text-align:center;color:#fff;font-weight:700;font-size:16px;letter-spacing:.05em;margin-bottom:14px;">SESSION COMPLETE 💪<br><span style="font-size:12px;opacity:.85;font-weight:400;">Tap COPY LOG and paste to Claude.</span></div>`:""}
    <div style="background:#fff;border:1px solid #E2E2E2;border-radius:12px;padding:14px 16px;margin-bottom:20px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:.1em;margin-bottom:8px;">HOW TO LOG</div>
      <div style="font-size:12px;color:#666;line-height:1.8;">1. Mark each exercise ✓ done or ✕ skip<br>2. When all are marked, the day turns ✓<br>3. Tap <span style="color:#FF5C00;font-weight:700;">COPY LOG</span> (copies only ✓ done)<br>4. Paste into Claude chat</div>
    </div>
  </div>`;
}
function cardHtml(i,bd){
  const e=getEx(i),ak=S.session+"||"+i,showAlt=S.openAlt===ak;
  const cal=e.weight==="CAL"||e.weight===""||e.weight===undefined;
  const safe=e.name.replace(/'/g,"\\'");
  return `
  <div class="card${e.done?" done":e.skip?" skip":""}">
    <div style="padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:7px;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:700;color:${e.done?"#16A34A":e.skip?"#B91C1C":"#111"};text-decoration:${e.done||e.skip?"line-through":"none"};">
          ${e.name}
          ${e.swapped?`<button onclick="rstSwap(${i})" style="margin-left:8px;font-size:9px;color:#666;background:none;border:1px solid #E2E2E2;border-radius:4px;padding:2px 5px;font-weight:700;">RESET</button>`:""}
        </div>
        ${e.alts.length>0?`<button onclick="togAlt('${ak}')" style="margin-top:5px;padding:0;border:none;background:none;color:#FF5C00;font-size:10px;font-weight:700;letter-spacing:.08em;">${showAlt?"▲ CLOSE":"▼ SWAP EXERCISE"}</button>`:""}
      </div>
      <button class="iconbtn" title="Copy name" onclick="cpName('${safe}')" style="width:34px;height:34px;">📋</button>
      <button title="Skip" onclick="setStat(${i},'skip')" style="width:34px;height:34px;border-radius:9px;flex-shrink:0;border:2px solid ${e.skip?"#DC2626":"#E2E2E2"};background:${e.skip?"#DC2626":"#fff"};display:flex;align-items:center;justify-content:center;"><span style="font-size:16px;font-weight:800;color:${e.skip?"#fff":"#C8C8C8"};">✕</span></button>
      <button title="Done" onclick="setStat(${i},'done')" style="width:34px;height:34px;border-radius:9px;flex-shrink:0;border:2px solid ${e.done?"#16A34A":"#E2E2E2"};background:${e.done?"#16A34A":"#fff"};display:flex;align-items:center;justify-content:center;"><span style="font-size:17px;font-weight:800;color:${e.done?"#fff":"#C8C8C8"};">✓</span></button>
    </div>
    ${showAlt?`<div style="padding:0 14px 10px;"><div style="font-size:10px;color:#666;letter-spacing:.1em;font-weight:700;margin-bottom:6px;">TAP TO SWAP:</div>${e.alts.map(a=>{const on=e.name===a;return`<button class="abtn${on?" on":""}" onclick="swpEx(${i},'${a.replace(/'/g,"\\'")}')"> ${on?"✓ ":"→ "}${a}${on?" <span style='font-size:10px;opacity:.8;margin-left:6px;'>ACTIVE</span>":""}</button>`;}).join("")}</div>`:""}
    <div style="padding:4px 14px 14px;display:flex;gap:8px;align-items:flex-end;">
      <div style="flex:1;"><div style="font-size:9px;color:#666;letter-spacing:.12em;margin-bottom:5px;font-weight:700;">SETS</div><input id="s-${i}" type="number" class="ni" min="1" value="${e.sets}" oninput="setFld(${i},'sets',this.value)"></div>
      <div style="font-size:22px;font-weight:900;color:#666;padding-bottom:8px;flex-shrink:0;">×</div>
      <div style="flex:1;"><div style="font-size:9px;color:#666;letter-spacing:.12em;margin-bottom:5px;font-weight:700;">REPS</div><input id="r-${i}" type="number" class="ni" min="1" value="${e.reps}" oninput="setFld(${i},'reps',this.value)"></div>
      <div style="flex:1.6;"><div style="font-size:9px;color:#666;letter-spacing:.12em;margin-bottom:5px;font-weight:700;">KG</div><input id="w-${i}" type="number" step=".5" class="ni${cal?" cal":""}" value="${cal?"":e.weight}" placeholder="${cal?"CAL":""}" oninput="setWt(${i},this.value)">${cal?`<div style="font-size:9px;color:#FF5C00;text-align:center;margin-top:3px;font-weight:700;">FIND TODAY</div>`:""}</div>
    </div>
  </div>`;
}
function extraHtml(e,idx,bd){
  const cal=!e.weight||e.weight==="",safe=e.name.replace(/'/g,"\\'");
  return `
  <div class="card extra${e.done?" done":""}">
    <div style="padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="font-size:13px;font-weight:700;flex:1;min-width:0;color:${e.done?"#16A34A":"#111"};text-decoration:${e.done?"line-through":"none"};">${e.name}</div>
      <button class="iconbtn" title="Copy name" onclick="cpName('${safe}')">📋</button>
      <button onclick="rmExt(${idx})" style="padding:4px 8px;border:1px solid #E2E2E2;border-radius:6px;background:none;color:#666;font-size:11px;">✕</button>
      <button onclick="togExtDone(${idx})" style="width:32px;height:32px;border-radius:8px;flex-shrink:0;border:2px solid ${e.done?"#16A34A":"#E2E2E2"};background:${e.done?"#16A34A":"#fff"};display:flex;align-items:center;justify-content:center;"><span style="font-size:16px;color:${e.done?"#fff":"#E2E2E2"};">${e.done?"✓":"○"}</span></button>
    </div>
    <div style="padding:0 14px 12px;display:flex;gap:8px;align-items:flex-end;">
      <div style="flex:1;"><div style="font-size:9px;color:#666;letter-spacing:.12em;margin-bottom:5px;font-weight:700;">SETS</div><input id="es-${idx}" type="number" class="ni" min="1" value="${e.sets||bd.sets}" oninput="updExt(${idx},'sets',this.value)"></div>
      <div style="font-size:22px;font-weight:900;color:#666;padding-bottom:8px;flex-shrink:0;">×</div>
      <div style="flex:1;"><div style="font-size:9px;color:#666;letter-spacing:.12em;margin-bottom:5px;font-weight:700;">REPS</div><input id="er-${idx}" type="number" class="ni" min="1" value="${e.reps||bd.reps}" oninput="updExt(${idx},'reps',this.value)"></div>
      <div style="flex:1.6;"><div style="font-size:9px;color:#666;letter-spacing:.12em;margin-bottom:5px;font-weight:700;">KG</div><input id="ew-${idx}" type="number" step=".5" class="ni${cal?" cal":""}" value="${e.weight||""}" placeholder="KG" oninput="updExt(${idx},'weight',this.value)"></div>
    </div>
  </div>`;
}
function addHtml(){
  const q=S.search.trim(),res=search(q),show=q.length>=2;
  return `
  <div style="background:#fff;border:2px dashed #E2E2E2;border-radius:14px;padding:14px;margin-bottom:14px;">
    <div style="font-size:11px;color:#666;letter-spacing:.12em;font-weight:700;margin-bottom:10px;">+ ADD EXERCISE</div>
    <div style="position:relative;">
      <input id="search-input" type="text" value="${S.search.replace(/"/g,"&quot;")}" placeholder="Search or type name..." oninput="updSearch(this.value)" style="width:100%;padding:11px 14px;border:2px solid ${q?"#FF5C00":"#E2E2E2"};border-radius:10px;font-size:13px;font-weight:600;color:#111;font-family:inherit;background:#fff;">
      ${show?`<div style="position:absolute;top:100%;left:0;right:0;z-index:50;background:#fff;border:2px solid #FF5C00;border-radius:10px;margin-top:4px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);">${res.map(r=>`<button class="sr" onclick="addEx('${r.replace(/'/g,"\\'")}')"><span style="color:#FF5C00;font-size:10px;font-weight:700;flex-shrink:0;">LIB</span>${r}</button>`).join("")}<button class="sr nw" onclick="addEx('${q.replace(/'/g,"\\'")}')"><span style="color:#FF5C00;font-size:10px;font-weight:700;flex-shrink:0;">${res.length?"OR":"NEW"}</span>Add "${q}" manually</button></div>`:""}
    </div>
  </div>`;
}

// ── HANDLERS ─────────────────────────────────────────────────
function setWk(w){upd({week:w,openAlt:null});}
function setSes(s){upd({session:s,openAlt:null,search:""});}
function togAlt(k){upd({openAlt:S.openAlt===k?null:k});}
function setStat(i,val){const k=lk(i);const cur=getEx(i).status;const ns=cur===val?null:val;const rec={...(S.log[k]||{}),status:ns};delete rec.done;S.log[k]=rec;upd({});}
function setFld(i,f,v){const n=parseInt(v);if(!isNaN(n)&&n>0){const k=lk(i);S.log[k]={...(S.log[k]||{}),[f]:n};sv();}}
function setWt(i,v){const n=parseFloat(v);S.weights[wk(S.session,i)]=isNaN(n)?"":n;sv();}
function swpEx(i,a){S.swaps[sk(S.session,i)]=a;S.weights[wk(S.session,i)]="CAL";upd({openAlt:null});}
function rstSwap(i){delete S.swaps[sk(S.session,i)];delete S.weights[wk(S.session,i)];upd({});}
function togExtDone(idx){const k=ek(),l=[...(S.extras[k]||[])];l[idx]={...l[idx],done:!l[idx].done};S.extras[k]=l;upd({});}
function rmExt(idx){const k=ek(),l=[...(S.extras[k]||[])];l.splice(idx,1);S.extras[k]=l;upd({});}
function updExt(idx,f,v){const k=ek(),l=[...(S.extras[k]||[])];const n=f==="weight"?parseFloat(v):parseInt(v);l[idx]={...l[idx],[f]:isNaN(n)?"":n};S.extras[k]=l;sv();}
function updSearch(v){S.search=v;render();}
function addEx(name){if(!name.trim())return;const k=ek(),bd=BDATA[gBlock(S.week)],l=[...(S.extras[k]||[])];l.push({name:name.trim(),sets:bd.sets,reps:bd.reps,weight:"",done:false});S.extras[k]=l;upd({search:""});}
function cpName(name){copyText(name,()=>toast("Copied: "+name));}
function cpLog(){copyText(fmtLog(),()=>{upd({copied:true});toast("Session log copied");setTimeout(()=>upd({copied:false}),2500);});}

// ── INIT ─────────────────────────────────────────────────────
ld();render();
</script>
</body>
</html>
